name: Feature Request
description: Propose a new capability, store adapter, or exporter improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues and [ROADMAP.md](../../ROADMAP.md) before submitting a proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the workflow gap or technical limitation this feature addresses.
      placeholder: Current behavior blocks...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Detail the expected UI, schema, or adapter behavior.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List any workarounds or alternative designs evaluated.
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor Checklist
      options:
        - label: I searched existing issues and ROADMAP.md before opening this request.
          required: true
        - label: This proposal preserves minimum MV3 permissions and the 10-field BOM schema.
          required: true
